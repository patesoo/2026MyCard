<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 명함 만들기</title>

    <!-- 구글 폰트 연결 (Black Han Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
    
    <link href="css/style.css" rel="stylesheet">
  </head>
  <body>

    <header class="site-header">
      <h1>나만의 명함 만들기</h1>
      <p>왼쪽에 입력하면 오른쪽에 명함이 만들어집니다.</p>
    </header>

    <main class="container">
      <section class="editor">
        <form action="#">

          <fieldset>
            <legend>기본 정보</legend>
            <label for="input-name">이름</label>
            <input type="text" id="input-name" name="name" placeholder="에 : 홍길동">
            <label for="input-dept">학과</label>

            <select id="input-dept">
               <option>컴퓨터공학과</option>
               <option>소프트웨어공학과</option>
               <option>인공지능학과</option>
               <option>게임콘텐츠학과</option>
               <option>정보보안학과</option>               
            </select>

            <label for="input-role">희망 분야</label>
            <input type="text" id="input-role" placeholder="예 : 프론트엔드 개발자">            
          </fieldset>

           <fieldset>
            
          </fieldset>

           <fieldset>
           <legend>연락처</legend>
           <label for="input-phone">전화번호</label>
           <input type="tel" id="input-phone" placeholder="예 : 010-8442-0167">

           <label for="input-email">이메일</label>
            <input type="email" id="input-email" placeholder="예 : tranphan2602@gmail.com">
          </fieldset>

  


          <fieldset>
             <legend>한 줄 소개</legend>
             <label for="input-intro">나를 소개하는 한 줄</label>
             <textarea id="input-intro" rows="3" placeholder="예 : 항상 최선을 다하는 사람."></textarea>            
          </fieldset>

          



        </form>
      </section>

      
      <section class="preview">
        <h2>미리보기</h2>

        <div class="card">
          <div class="card-top">          
            <p class="card-dept">컴퓨터공학과</p>
            <p class="card-name">홍길동</p>
            <p class="card-role">프론트엔드 개발자</p>          
        </div>

        <p class="card-intro">항상 최선을 다하는 사람.</p>

        <ul class="card-contact">
          <li>☎️<span class="card-phone">010-8442-0167</span></li>
          <li>🦥<span class="card-email">tranphan2602@gmail.com</span></li>
        </ul>



      </section>

    </main>

    <footer class="site-footer">
      <small>&copy; 2026 웹기초프로그래밍 - 응원 판 옥 짠</small>


    </footer>
    <script src="js/script.js"></script>

  </body>
</html>
